<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>localsub Phase0 v2 - VAD+进度+WebGPU诊断</title>
<style>
  body { font-family: system-ui; max-width: 760px; margin: 40px auto; background: #1a1a2e; color: #eee; padding: 0 16px; }
  h1 { font-size: 20px; }
  .card { background: #16213e; border-radius: 10px; padding: 16px 20px; margin: 14px 0; }
  button { padding: 10px 22px; border: none; border-radius: 8px; background: #4f8cff; color: white; font-size: 15px; cursor: pointer; }
  button:disabled { background: #555; }
  #status { margin-top: 10px; font-size: 14px; color: #9fd; white-space: pre-wrap; }
  .num { color: #ffd54f; font-weight: bold; }
  .bar { height: 18px; background: #0d1b3e; border-radius: 9px; overflow: hidden; margin: 8px 0; }
  .bar > div { height: 100%; background: linear-gradient(90deg,#4f8cff,#38d39f); width: 0%; transition: width .3s; }
  pre { background:#0d1b3e; padding:8px; border-radius:6px; font-size:12px; overflow-x:auto; }
</style>
</head>
<body>
<h1>localsub Phase 0 v2 · VAD 前置 + 实时进度</h1>

<div class="card">
  <div>后端: <span id="backend" class="num">检测中…</span></div>
  <div id="gpudiag"></div>
</div>

<div class="card">
  <p>1️⃣ 选择音频/视频文件</p>
  <input type="file" id="file" accept="audio/*,video/*">
  <p style="margin-top:12px">2️⃣ 模型:
    <select id="model">
      <option value="Xenova/whisper-base">whisper-base (~80MB, 快)</option>
      <option value="onnx-community/whisper-small" selected>whisper-small (~250MB, 准)</option>
    </select>
    <label style="margin-left:12px"><input type="checkbox" id="usevad" checked> Silero VAD 前置</label>
    <label style="margin-left:12px">后端 <select id="backendSel">
      <option value="auto" selected>auto（诊断推荐）</option>
      <option value="webgpu">webgpu（强制）</option>
      <option value="wasm">wasm（强制）</option>
    </select></label>
    <label style="margin-left:12px">并发 <select id="concurrency">
      <option value="1">1（串行）</option>
      <option value="2" selected>2</option>
      <option value="3">3</option>
      <option value="4">4</option>
    </select> 路</label>
  </p>
  <p><button id="run" disabled>开始转写</button></p>
  <div class="bar"><div id="prog"></div></div>
  <div id="status">等待文件…</div>
</div>

<div class="card">
  <h3>结果</h3>
  <div id="result">-</div>
  <details style="margin-top:10px"><summary>转写明细</summary><pre id="detail"></pre></details>
</div>

<script type="module">
import { pipeline, env } from '/node_modules/@huggingface/transformers/dist/transformers.min.js';
import * as ort from '/node_modules/onnxruntime-web/dist/ort.all.min.mjs';

env.allowRemoteModels = false;
env.allowLocalModels = true;
env.localModelPath = '/web/models/';

const $ = (id) => document.getElementById(id);
let audioData = null, transcriber = null, vadSess = null, currentModel = '';
const setProg = (p) => $('prog').style.width = (p * 100).toFixed(1) + '%';

// ===== WebGPU 诊断 =====
(async () => {
  const diag = [];
  if (!('gpu' in navigator)) {
    diag.push('navigator.gpu 不存在：浏览器不支持或非安全上下文(需 https/localhost)');
    $('backend').textContent = 'wasm';
  } else {
    try {
      const a = await navigator.gpu.requestAdapter({ powerPreference: 'high-performance' });
      if (a) {
        diag.push(`✅ WebGPU adapter: ${a.info?.description || a.info?.vendor || 'ok'}`);
        $('backend').textContent = 'webgpu';
      } else {
        const b = await navigator.gpu.requestAdapter(); // 兜底低功耗
        if (b) {
          diag.push(`⚠️ 高性能 adapter 不可用，回落默认: ${b.info?.description || b.info?.vendor || ''}`);
          $('backend').textContent = 'webgpu';
        } else {
          diag.push('⚠️ adapter 为 null（常见原因: HTTP 非安全上下文 / 显卡驱动 / chrome://flags）');
          $('backend').textContent = 'wasm';
        }
      }
    } catch (e) { diag.push('❌ ' + e.message); $('backend').textContent = 'wasm'; }
  }
  if (!window.isSecureContext) diag.push('⚠️ 非安全上下文（isSecureContext=false）——WebGPU 需要 https 或 localhost。可试 https://192.168.1.2:8931 （自签证书点高级→继续）');
  $('gpudiag').innerHTML = diag.map(d => `<div>${d}</div>`).join('');
})();

// ===== 文件解码 =====
$('file').addEventListener('change', async (e) => {
  const f = e.target.files[0];
  if (!f) return;
  $('status').textContent = '解码音频…';
  const ab = await f.arrayBuffer();
  const ctx = new AudioContext({ sampleRate: 16000 });
  const decoded = await ctx.decodeAudioData(ab);
  audioData = { pcm: decoded.getChannelData(0), dur: decoded.duration, name: f.name };
  $('status').textContent = `就绪: ${f.name}, 时长 ${decoded.duration.toFixed(1)}s`;
  $('run').disabled = false;
});

// ===== Silero VAD（onnxruntime-web 直载）=====
async function loadVad() {
  if (vadSess) return vadSess;
  vadSess = await ort.InferenceSession.create('/web/models/silero-vad/silero_vad.onnx', {
    executionProviders: ['wasm'], graphOptimizationLevel: 'all'
  });
  return vadSess;
}

async function detectSpeech(pcm) {
  const SR = 16000, WIN = 512;              // silero v5: 512 样本窗 @16k
  const sess = await loadVad();
  let state = new ort.Tensor('float32', new Float32Array(2 * 1 * 128), [2, 1, 128]);
  const sr = new ort.Tensor('int64', BigInt64Array.from([BigInt(SR)]), []);
  let speech = false, segStart = 0;
  const segs = [];
  const TH_ON = 0.5, TH_OFF = 0.35, PAD = 0.3, MIN_SEG = 0.5, MIN_GAP = 0.2;
  let offCount = 0, frames = 0;
  const totalWins = Math.floor(pcm.length / WIN);
  for (let w = 0; w < totalWins; w++) {
    const chunk = pcm.subarray(w * WIN, (w + 1) * WIN);
    const input = new ort.Tensor('float32', Float32Array.from(chunk), [1, WIN]);
    const out = await sess.run({ input, state, sr });
    const p = out.output.data[0];
    state = out.stateN;
    const t = (w + 1) * WIN / SR;
    frames++;
    if (!speech && p > TH_ON) { speech = true; segStart = Math.max(0, t - PAD); offCount = 0; }
    else if (speech && p < TH_OFF) {
      if (++offCount * WIN / SR > 0.4) {   // 连续 0.4s 低于阈值才断句
        speech = false;
        if (t - segStart > MIN_SEG) segs.push([segStart, Math.min(pcm.length / SR, t + PAD)]);
        offCount = 0;
      }
    } else if (speech && p >= TH_OFF) offCount = 0;
    if (frames % 200 === 0) { setProg(0.3 * frames / totalWins); await new Promise(r => setTimeout(r)); }
  }
  if (speech) segs.push([segStart, pcm.length / SR]);
  // 合并过近段
  const merged = [];
  for (const s of segs) {
    if (merged.length && s[0] - merged[merged.length - 1][1] < MIN_GAP)
      merged[merged.length - 1][1] = s[1];
    else merged.push([...s]);
  }
  return merged;
}

// ===== 主流程 =====
$('run').addEventListener('click', async () => {
  if (!audioData) return;
  $('run').disabled = true;
  const model = $('model').value;
  const useVad = $('usevad').checked;
  const CONC = parseInt($('concurrency').value, 10);
  // 后端选择：用户强制项优先；auto = webgpu 可用则用
  const backendChoice = $('backendSel').value;
  const useDevice = backendChoice === 'auto'
    ? ($('backend').textContent === 'webgpu' ? 'webgpu' : 'wasm')
    : backendChoice;
  const loadedKey = `${model}|${useDevice}`;
  try {
    // 并发≥2 走 Worker 池，主线程不预载模型（省一份内存）
    if (CONC < 2 && (!transcriber || currentModel !== loadedKey)) {
      $('status').textContent = `加载模型 ${model} @ ${useDevice}（本地文件）…`;
      transcriber = await pipeline('automatic-speech-recognition', model, {
        dtype: (useDevice === 'webgpu')
          ? { encoder_model: 'fp16', decoder_model_merged: 'q4' }
          : 'q8',
        device: useDevice,
      });
      currentModel = loadedKey;
    }
    const { pcm, dur } = audioData;

    // VAD
    let segs = [[0, dur]];
    if (useVad) {
      $('status').textContent = 'VAD 检测人声段…';
      const t0 = performance.now();
      segs = await detectSpeech(pcm);
      const speechSec = segs.reduce((a, [x, y]) => a + y - x, 0);
      $('status').textContent = `VAD: ${segs.length} 段 / ${speechSec.toFixed(1)}s 人声 (耗时 ${((performance.now()-t0)/1000).toFixed(1)}s)，开始转写…`;
    }

    // 分段转写（并发1=主线程串行对照；并发≥2=Worker池真并行，每Worker独立ort session）
    const jobs = segs
      .map(([ss, se]) => ({ ss, se }))
      .filter(({ ss, se }) => (se - ss) * 16000 >= 8000);
    const results = new Array(jobs.length);
    const t1 = performance.now();
    let doneIdx = 0, doneSec = 0;
    const totalSec = jobs.reduce((a, j) => a + j.se - j.ss, 0);
    const updateProg = () => {
      const frac = doneSec / Math.max(totalSec, 0.01);
      setProg(0.3 + 0.7 * frac);
      const elapsed = (performance.now() - t1) / 1000;
      const eta = elapsed / Math.max(frac, 0.01) * (1 - frac);
      $('status').textContent = `转写中 ${doneIdx}/${jobs.length} 段 (${(frac * 100).toFixed(0)}%) · 并发${CONC}${CONC >= 2 ? '·Worker池' : ''} · 已用 ${elapsed.toFixed(0)}s · 预计剩余 ${eta.toFixed(0)}s`;
    };

    if (CONC >= 2) {
      // ---- Worker 池（阶梯启动：第1个先加载写缓存，其余等它 ready 再启，避免并发重复下载模型）----
      const NW = Math.min(CONC, jobs.length);
      const workers = [];
      let nextJob = 0;

      const attachWorker = (w, wi) => new Promise((resolve, reject) => {
        w.onerror = (e) => reject(new Error(`Worker${wi}: ${e.message || 'error'}`));
        w.onmessage = (e) => {
          const m = e.data;
          if (m.type === 'ready') {
            const takeNext = () => {
              const i = nextJob++;
              if (i >= jobs.length) { w.terminate(); resolve(); return; }
              const { ss, se } = jobs[i];
              const seg = pcm.slice(Math.floor(ss * 16000), Math.floor(se * 16000));
              w.postMessage({ type: 'job', jobId: i, pcm: seg, ss, se }, [seg.buffer]);
            };
            takeNext();
          } else if (m.type === 'result') {
            results[m.jobId] = m.chunks;
            doneIdx++; doneSec += jobs[m.jobId].se - jobs[m.jobId].ss;
            updateProg();
            const i = nextJob++;
            if (i >= jobs.length) { w.terminate(); resolve(); return; }
            const { ss, se } = jobs[i];
            const seg = pcm.slice(Math.floor(ss * 16000), Math.floor(se * 16000));
            w.postMessage({ type: 'job', jobId: i, pcm: seg, ss, se }, [seg.buffer]);
          } else if (m.type === 'error') {
            reject(new Error(m.message));
          }
        };
      });

      // 阶梯式：W0 先加载（写缓存），ready 后再依次启动 W1..Wn-1（直接命中缓存）
      $('status').textContent = `Worker 1/${NW} 加载模型（后端: ${useDevice}）…`;
      const w0 = new Worker('/web/worker.js', { type: 'module' });
      workers.push(attachWorker(w0, 0));
      const p0ready = new Promise((res, rej) => {
        const orig = w0.onmessage;
        w0.addEventListener('message', function once(e) {
          if (e.data.type === 'ready') { w0.removeEventListener('message', once); res(); }
          if (e.data.type === 'error') { w0.removeEventListener('message', once); rej(new Error(e.data.message)); }
        });
      });
      w0.postMessage({ type: 'init', modelId: model, device: useDevice });
      await p0ready;
      for (let k = 1; k < NW; k++) {
        $('status').textContent = `Worker ${k + 1}/${NW} 从缓存加载…`;
        const wk = new Worker('/web/worker.js', { type: 'module' });
        workers.push(attachWorker(wk, k));
        wk.postMessage({ type: 'init', modelId: model, device: useDevice });
      }
      await Promise.all(workers);
    } else {
      // ---- 主线程串行（对照） ----
      for (let ji = 0; ji < jobs.length; ji++) {
        const { ss, se } = jobs[ji];
        const seg = pcm.slice(Math.floor(ss * 16000), Math.floor(se * 16000));
        const out = await transcriber(seg, {
          language: 'chinese', task: 'transcribe', return_timestamps: true,
          chunk_length_s: 30, stride_length_s: 5,
        });
        results[ji] = (out.chunks || []).map((c) => {
          const ts = c.timestamp;
          return { timestamp: [ss + (ts[0] || 0), ss + (ts[1] ?? se - ss)], text: c.text };
        });
        doneIdx++; doneSec += se - ss;
        updateProg();
        await new Promise(r => setTimeout(r));
      }
    }
    const chunks = results.flat();
    const el = (performance.now() - t1) / 1000;
    const rtf = el / dur;

    $('result').innerHTML = `
      <div>⏱ 转写 <span class="num">${el.toFixed(1)}s</span> / 音频 <span class="num">${dur.toFixed(1)}s</span></div>
      <div style="font-size:22px;margin:8px 0">RTF = <span class="num">${rtf.toFixed(2)}</span>${rtf < 1 ? ' ✅ 达标' : ' ⚠️ 未达标'}</div>
      <div>后端: <span class="num">${useDevice}</span> · 模型: ${model} · VAD: ${useVad ? segs.length + ' 段' : '关'} · 并发: ${CONC}</div>`;
    $('detail').textContent = chunks.map(c =>
      `[${c.timestamp[0].toFixed(1).padStart(7)}-${c.timestamp[1].toFixed(1).padStart(7)}] ${c.text}`).join('\n');
    $('status').textContent = '完成 ✅';
    setProg(1);
  } catch (err) {
    $('status').textContent = '失败: ' + err.message;
    console.error(err);
  } finally {
    $('run').disabled = false;
  }
});
</script>
</body>
</html>
